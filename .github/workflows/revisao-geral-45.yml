name: Revisao geral 4.5

on:
  push:
    paths:
      - '.github/workflows/revisao-geral-45.yml'

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aplicar correcoes auditadas
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          APP = ROOT / 'CONTROLE DE CONSUMO'
          VELHA = '4.4.0'
          NOVA = '4.5.0'

          def ler(path):
              return path.read_text(encoding='utf-8')

          def gravar(path, texto):
              path.write_text(texto, encoding='utf-8')

          def trocar_uma(path, antigo, novo, descricao):
              texto = ler(path)
              qtd = texto.count(antigo)
              if qtd != 1:
                  raise RuntimeError(f'{descricao}: esperado 1 trecho em {path}, encontrado {qtd}')
              gravar(path, texto.replace(antigo, novo, 1))

          # ------------------------------------------------------------
          # FALTAS: integra o desconto de forma nativa, sem monkey-patch.
          # ------------------------------------------------------------
          faltas_html = APP / 'faltas.html'
          trocar_uma(
              faltas_html,
              '''                                <th>MOTIVO</th>\n                                <th>OBSERVAÇÃO</th>\n                                <th class="coluna-acoes">AÇÕES</th>''',
              '''                                <th>MOTIVO</th>\n                                <th>DESCONTO</th>\n                                <th>OBSERVAÇÃO</th>\n                                <th class="coluna-acoes">AÇÕES</th>''',
              'cabecalho de faltas'
          )
          trocar_uma(
              faltas_html,
              '''                                <td colspan="5" class="tabela-vazia">''',
              '''                                <td colspan="6" class="tabela-vazia">''',
              'colspan inicial de faltas'
          )
          trocar_uma(
              faltas_html,
              '''                <div class="grupo-input-modal">\n                    <label for="cad-motivo-falta">Motivo</label>\n                    <input type="text" id="cad-motivo-falta" placeholder="Ex: Atestado, Pessoal, Falta injustificada...">\n                </div>\n\n                <div class="grupo-input-modal">\n                    <label for="cad-obs-falta">Observação (opcional)</label>''',
              '''                <div class="grupo-input-modal">\n                    <label for="cad-motivo-falta">Motivo</label>\n                    <input type="text" id="cad-motivo-falta" placeholder="Ex: Atestado, Pessoal, Falta injustificada...">\n                </div>\n\n                <div class="grupo-input-modal bloco-desconto-falta">\n                    <label class="opcao-desconto-falta" for="cad-descontar-falta">\n                        <input type="checkbox" id="cad-descontar-falta" onchange="alternarCampoDescontoFalta()">\n                        <span>Descontar esta falta do funcionário</span>\n                    </label>\n                    <p class="ajuda-desconto-falta">\n                        Marque somente quando esta falta realmente gerar desconto em folha.\n                    </p>\n                    <div id="grupo-valor-desconto-falta" class="campo-valor-desconto-falta" style="display:none;">\n                        <label for="cad-valor-desconto-falta">Valor do desconto (R$) *</label>\n                        <input type="text" id="cad-valor-desconto-falta" inputmode="decimal" autocomplete="off" placeholder="0,00">\n                    </div>\n                </div>\n\n                <div class="grupo-input-modal">\n                    <label for="cad-obs-falta">Observação (opcional)</label>''',
              'campos de desconto da falta'
          )

          faltas_js = APP / 'faltas-supabase.js'
          trocar_uma(
              faltas_js,
              '''    function normalizarNome(valor) {\n        return String(valor || "").trim().toLocaleLowerCase("pt-BR");\n    }\n''',
              '''    function normalizarNome(valor) {\n        return String(valor || "").trim().toLocaleLowerCase("pt-BR");\n    }\n\n    function numeroMoeda(valor) {\n        if (window.formatarMoeda) return window.formatarMoeda(valor);\n        const texto = String(valor || "0")\n            .replace(/\\s/g, "")\n            .replace(/^R\\$/i, "");\n        const normalizado = texto.includes(",")\n            ? texto.replace(/\\./g, "").replace(",", ".")\n            : texto;\n        const n = Number(normalizado.replace(/[^0-9.-]/g, ""));\n        return Number.isFinite(n) ? Math.max(0, n) : 0;\n    }\n\n    function moedaTela(valor) {\n        const n = Math.max(0, Number(valor) || 0);\n        if (window.moedaBR) return window.moedaBR(n);\n        return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });\n    }\n''',
              'helpers de desconto em faltas'
          )
          texto = ler(faltas_js)
          qtd_select = texto.count('id,funcionario_id,data,motivo,observacao,created_at')
          if qtd_select < 2:
              raise RuntimeError(f'selects de faltas: esperado ao menos 2, encontrado {qtd_select}')
          texto = texto.replace(
              'id,funcionario_id,data,motivo,observacao,created_at',
              'id,funcionario_id,data,motivo,observacao,valor_desconto,created_at'
          )
          gravar(faltas_js, texto)
          trocar_uma(
              faltas_js,
              '''                observacao: falta.observacao || ""\n            };''',
              '''                observacao: falta.observacao || "",\n                valorDesconto: Number(falta.valor_desconto || 0)\n            };''',
              'espelho de faltas'
          )
          trocar_uma(
              faltas_js,
              '''    window.abrirModalFalta = function () {''',
              '''    window.alternarCampoDescontoFalta = function () {\n        const marcado = Boolean($("cad-descontar-falta")?.checked);\n        const grupo = $("grupo-valor-desconto-falta");\n        const campo = $("cad-valor-desconto-falta");\n\n        if (grupo) grupo.style.display = marcado ? "block" : "none";\n        if (campo) {\n            campo.required = marcado;\n            if (!marcado) campo.value = "";\n        }\n    };\n\n    window.abrirModalFalta = function () {''',
              'controle visual do desconto'
          )
          trocar_uma(
              faltas_js,
              '''        $("cad-motivo-falta").value = "";\n        $("cad-obs-falta").value = "";\n        $("modal-falta").style.display = "flex";''',
              '''        $("cad-motivo-falta").value = "";\n        $("cad-obs-falta").value = "";\n        if ($("cad-descontar-falta")) $("cad-descontar-falta").checked = false;\n        if ($("cad-valor-desconto-falta")) $("cad-valor-desconto-falta").value = "";\n        window.alternarCampoDescontoFalta();\n        $("modal-falta").style.display = "flex";''',
              'reset do modal de falta'
          )
          trocar_uma(
              faltas_js,
              '''    async function registrarHistoricoLocal(acao, detalhes, icone) {\n        // O Histórico será migrado ao Supabase em etapa própria.\n        if (window.registrarNoHistorico) {\n            window.registrarNoHistorico(acao, detalhes, icone);\n        }\n    }''',
              '''    async function registrarHistoricoLocal(acao, detalhes, icone) {\n        if (window.registrarNoHistorico) {\n            return await window.registrarNoHistorico(acao, detalhes, icone);\n        }\n        return false;\n    }''',
              'espera do historico de faltas'
          )
          trocar_uma(
              faltas_js,
              '''        const observacao = $("cad-obs-falta").value.trim();\n        const funcionario = obterFuncionarioPorId(funcionarioId);''',
              '''        const observacao = $("cad-obs-falta").value.trim();\n        const descontar = Boolean($("cad-descontar-falta")?.checked);\n        const valorDesconto = descontar\n            ? numeroMoeda($("cad-valor-desconto-falta")?.value || "")\n            : 0;\n        const funcionario = obterFuncionarioPorId(funcionarioId);''',
              'leitura do desconto'
          )
          trocar_uma(
              faltas_js,
              '''        if (!data) {\n            alert("Informe a data da falta.");\n            return;\n        }\n\n        const payload = {''',
              '''        if (!data) {\n            alert("Informe a data da falta.");\n            return;\n        }\n\n        if (descontar && valorDesconto <= 0) {\n            alert("Informe um valor de desconto maior que zero.");\n            $("cad-valor-desconto-falta")?.focus();\n            return;\n        }\n\n        const payload = {''',
              'validacao do desconto'
          )
          trocar_uma(
              faltas_js,
              '''            motivo: motivo || "",\n            observacao: observacao || null\n        };''',
              '''            motivo: motivo || "",\n            observacao: observacao || null,\n            valor_desconto: valorDesconto\n        };''',
              'payload do desconto'
          )
          trocar_uma(
              faltas_js,
              '''                `${funcionario.nome} - ${motivo || "Sem motivo informado"} - ${dataBancoParaTela(salva?.data || data)}`,''',
              '''                `${funcionario.nome} - ${motivo || "Sem motivo informado"} - ${dataBancoParaTela(salva?.data || data)} - ${valorDesconto > 0 ? `Desconto: ${moedaTela(valorDesconto)}` : "Sem desconto"}`,''',
              'historico do desconto'
          )
          trocar_uma(
              faltas_js,
              '''                    <td colspan="5" class="tabela-vazia">''',
              '''                    <td colspan="6" class="tabela-vazia">''',
              'colspan dinamico de faltas'
          )
          trocar_uma(
              faltas_js,
              '''            const idSeguro = JSON.stringify(falta.id);\n\n            return `''',
              '''            const idSeguro = JSON.stringify(falta.id);\n            const desconto = Math.max(0, Number(falta.valor_desconto || 0));\n\n            return `''',
              'calculo de desconto na tabela'
          )
          trocar_uma(
              faltas_js,
              '''                    <td style="text-align:left;">${escaparHtml(falta.motivo || "—")}</td>\n                    <td style="text-align:left;color:#666;">${escaparHtml(falta.observacao || "—")}</td>''',
              '''                    <td style="text-align:left;">${escaparHtml(falta.motivo || "—")}</td>\n                    <td style="text-align:left;">\n                        ${desconto > 0\n                            ? `<span class="badge-desconto-falta">- ${escaparHtml(moedaTela(desconto))}</span>`\n                            : `<span class="badge-sem-desconto">Sem desconto</span>`}\n                    </td>\n                    <td style="text-align:left;color:#666;">${escaparHtml(falta.observacao || "—")}</td>''',
              'coluna de desconto na tabela'
          )
          trocar_uma(
              faltas_js,
              '''                    motivo,\n                    observacao: observacao || null\n                });''',
              '''                    motivo,\n                    observacao: observacao || null,\n                    valor_desconto: Math.max(0, numeroMoeda(item.valor_desconto ?? item.valorDesconto ?? 0))\n                });''',
              'importacao antiga de faltas'
          )

          # ------------------------------------------------------------
          # RELATORIOS: desconto de falta calculado por ID, nativamente.
          # ------------------------------------------------------------
          rel_js = APP / 'relatorios-supabase.js'
          trocar_uma(
              rel_js,
              '''            .select("id,funcionario_id,data,motivo,observacao,created_at")''',
              '''            .select("id,funcionario_id,data,motivo,observacao,valor_desconto,created_at")''',
              'select de faltas no relatorio'
          )
          trocar_uma(
              rel_js,
              '''            const salario = numero(funcionario.salario);\n            const salarioLiquido = salario - totalConsumos;''',
              '''            const totalDescontoFaltas = faltasFunc.reduce(\n                (soma, falta) => soma + Math.max(0, numero(falta.valor_desconto)),\n                0\n            );\n\n            const totalDescontar = totalConsumos + totalDescontoFaltas;\n            const salario = numero(funcionario.salario);\n            const salarioLiquido = salario - totalDescontar;''',
              'calculo mensal completo'
          )
          trocar_uma(
              rel_js,
              '''                    <td style="color:#d9534f;font-weight:bold;">\n                        - ${escaparHtml(moeda(totalConsumos))}\n                    </td>\n                    <td>${faltasFunc.length.toLocaleString("pt-BR")}</td>\n                    <td style="color:${salarioLiquido < 0 ? "#b00020" : "#28a745"};font-weight:bold;">''',
              '''                    <td style="color:#d9534f;font-weight:bold;">\n                        - ${escaparHtml(moeda(totalConsumos))}\n                    </td>\n                    <td>${faltasFunc.length.toLocaleString("pt-BR")}</td>\n                    <td style="color:${totalDescontoFaltas > 0 ? "#d9534f" : "#777"};font-weight:bold;">\n                        ${totalDescontoFaltas > 0 ? `- ${escaparHtml(moeda(totalDescontoFaltas))}` : escaparHtml(moeda(0))}\n                    </td>\n                    <td style="color:#8a4b08;font-weight:bold;">\n                        - ${escaparHtml(moeda(totalDescontar))}\n                    </td>\n                    <td style="color:${salarioLiquido < 0 ? "#b00020" : "#28a745"};font-weight:bold;">''',
              'colunas mensais de desconto'
          )
          trocar_uma(
              rel_js,
              '''                    <td colspan="7" style="text-align:center;color:#666;padding:20px;">''',
              '''                    <td colspan="9" style="text-align:center;color:#666;padding:20px;">''',
              'colspan mensal'
          )
          trocar_uma(
              rel_js,
              '''                <th>Consumos</th>\n                <th>A Descontar</th>\n                <th>Faltas</th>\n                <th>Salário Líquido</th>''',
              '''                <th>Consumos</th>\n                <th>Desconto Consumos</th>\n                <th>Faltas</th>\n                <th>Desconto Faltas</th>\n                <th>A Descontar</th>\n                <th>Salário Líquido</th>''',
              'cabecalho mensal'
          )

          # ------------------------------------------------------------
          # BACKUP: preserva o valor de desconto ao recuperar uma falta.
          # ------------------------------------------------------------
          cfg_js = APP / 'configuracoes-supabase.js'
          trocar_uma(
              cfg_js,
              '''                motivo: r.motivo || "",\n                observacao: r.observacao || null,\n                created_at: r.created_at || new Date().toISOString()''',
              '''                motivo: r.motivo || "",\n                observacao: r.observacao || null,\n                valor_desconto: Math.max(0, Number(r.valor_desconto || 0)),\n                created_at: r.created_at || new Date().toISOString()''',
              'restauracao do desconto da falta'
          )

          # O total tambem segue no payload; o banco sera a ultima camada de garantia.
          cons_js = APP / 'consumos-supabase.js'
          trocar_uma(
              cons_js,
              '''            quantidade,\n            preco_unitario: precoUnitario,\n            data_hora: new Date().toISOString()''',
              '''            quantidade,\n            preco_unitario: precoUnitario,\n            valor_total: precoUnitario * quantidade,\n            data_hora: new Date().toISOString()''',
              'valor total do consumo no payload'
          )

          # Identidade consistente: nenhuma tela tenta trocar XB para X.
          for path in APP.glob('*.js'):
              texto = ler(path)
              texto = texto.replace('if (avatar) avatar.textContent = "X";', 'if (avatar) avatar.textContent = "XB";')
              gravar(path, texto)

          # ------------------------------------------------------------
          # CSS nativo para desconto de faltas.
          # ------------------------------------------------------------
          css = APP / 'style.css'
          texto_css = ler(css)
          marcador = 'X-BURGUER 4.5 - FALTAS / ESTABILIDADE FINAL'
          if marcador not in texto_css:
              texto_css += '''\n\n/* ============================================================\n   X-BURGUER 4.5 - FALTAS / ESTABILIDADE FINAL\n   ============================================================ */\n.bloco-desconto-falta {\n    padding: 14px;\n    border: 1px solid #eadede;\n    border-radius: 12px;\n    background: #fffafa;\n}\n\n.opcao-desconto-falta {\n    display: flex !important;\n    align-items: center;\n    gap: 10px;\n    cursor: pointer;\n    margin: 0 !important;\n    color: #333 !important;\n    font-weight: 800 !important;\n}\n\n.opcao-desconto-falta input[type="checkbox"] {\n    width: 18px !important;\n    height: 18px !important;\n    margin: 0 !important;\n    accent-color: #7a0b0b;\n    flex: 0 0 auto;\n}\n\n.ajuda-desconto-falta {\n    margin: 7px 0 0 28px;\n    font-size: 12px;\n    line-height: 1.4;\n    color: #777;\n}\n\n.campo-valor-desconto-falta {\n    margin-top: 14px;\n    padding-top: 14px;\n    border-top: 1px solid #eee2e2;\n}\n\n.campo-valor-desconto-falta input {\n    width: 100%;\n}\n\n.badge-desconto-falta,\n.badge-sem-desconto {\n    display: inline-flex;\n    align-items: center;\n    min-height: 28px;\n    padding: 5px 9px;\n    border-radius: 999px;\n    font-size: 12px;\n    font-weight: 800;\n    white-space: nowrap;\n}\n\n.badge-desconto-falta {\n    color: #9f1d14;\n    background: #fff0ef;\n    border: 1px solid #f1c4c0;\n}\n\n.badge-sem-desconto {\n    color: #667085;\n    background: #f4f6f8;\n    border: 1px solid #e4e7ec;\n}\n\n@media (max-width: 700px) {\n    .bloco-desconto-falta {\n        padding: 13px !important;\n        min-width: 0 !important;\n        max-width: 100% !important;\n        box-sizing: border-box !important;\n    }\n\n    .ajuda-desconto-falta {\n        margin-left: 28px !important;\n    }\n\n    .campo-valor-desconto-falta input {\n        width: 100% !important;\n        min-width: 0 !important;\n        max-width: 100% !important;\n        box-sizing: border-box !important;\n    }\n}\n'''
          gravar(css, texto_css)

          # ------------------------------------------------------------
          # Remove camada antiga que duplicava consultas e podia duplicar colunas.
          # ------------------------------------------------------------
          legado = APP / 'desconto-faltas.js'
          if legado.exists():
              legado.unlink()

          sw = ROOT / 'service-worker.js'
          texto_sw = ler(sw)
          texto_sw = texto_sw.replace('  "./CONTROLE%20DE%20CONSUMO/desconto-faltas.js",\n', '')
          texto_sw = re.sub(r'xburguer-pwa-v[0-9.]+', f'xburguer-pwa-v{NOVA}', texto_sw)
          gravar(sw, texto_sw)

          # ------------------------------------------------------------
          # Versao/cache unificados em todo o frontend.
          # ------------------------------------------------------------
          for path in list(APP.glob('*.html')) + [ROOT / 'index.html', ROOT / 'offline.html', ROOT / '404.html']:
              texto = ler(path)
              texto = texto.replace(f'?v={VELHA}', f'?v={NOVA}')
              texto = texto.replace(f'Versão {VELHA}', f'Versão {NOVA}')
              gravar(path, texto)

          app_js = APP / 'app.js'
          texto_app = ler(app_js)
          texto_app = re.sub(
              r'window\.XBURGUER_VERSAO\s*=\s*"[0-9.]+";',
              f'window.XBURGUER_VERSAO = "{NOVA}";',
              texto_app,
              count=1
          )
          texto_app = texto_app.replace('X-BURGUER PWA 4.4', 'X-BURGUER PWA 4.5')
          gravar(app_js, texto_app)

          # ------------------------------------------------------------
          # Auditoria passa a proteger tambem estas regras de negocio.
          # ------------------------------------------------------------
          auditor = ROOT / 'scripts' / 'auditar_site.py'
          texto_aud = ler(auditor)
          ancora = '''    sw = (ROOT / "service-worker.js").read_text(encoding="utf-8")\n'''
          bloco = '''    # Regras funcionais criticas que ja causaram regressao no sistema.\n    faltas_html = (APP / "faltas.html").read_text(encoding="utf-8")\n    faltas_js = (APP / "faltas-supabase.js").read_text(encoding="utf-8")\n    relatorios_js = (APP / "relatorios-supabase.js").read_text(encoding="utf-8")\n    configuracoes_js = (APP / "configuracoes-supabase.js").read_text(encoding="utf-8")\n\n    if "cad-descontar-falta" not in faltas_html or "cad-valor-desconto-falta" not in faltas_html:\n        erro("faltas: controles de desconto nao estao presentes na tela")\n    if "valor_desconto" not in faltas_js:\n        erro("faltas: valor_desconto nao esta integrado ao CRUD")\n    if "valor_desconto" not in relatorios_js or "Desconto Faltas" not in relatorios_js:\n        erro("relatorios: desconto de faltas nao esta integrado ao relatorio mensal")\n    if "valor_desconto: Math.max(0, Number(r.valor_desconto || 0))" not in configuracoes_js:\n        erro("backup: restauracao de faltas nao preserva valor_desconto")\n    if (APP / "desconto-faltas.js").exists():\n        erro("faltas: camada antiga desconto-faltas.js ainda existe")\n\n    for path in APP.glob("*.js"):\n        texto = path.read_text(encoding="utf-8")\n        if 'avatar.textContent = "X"' in texto:\n            erro(f"{path.relative_to(ROOT)}: identidade antiga do avatar ainda presente")\n\n'''
          if 'Regras funcionais criticas que ja causaram regressao' not in texto_aud:
              if ancora not in texto_aud:
                  raise RuntimeError('ancora da auditoria nao encontrada')
              texto_aud = texto_aud.replace(ancora, bloco + ancora, 1)
          gravar(auditor, texto_aud)

          # Workflow antigo de geracao de icone era pontual e hardcodava 4.4.0.
          # Remove para impedir rollback acidental de versao em futuras manutencoes.
          antigo_workflow = ROOT / '.github' / 'workflows' / 'atualizar-icone-app.yml'
          if antigo_workflow.exists():
              antigo_workflow.unlink()

          print('Correcoes 4.5 aplicadas com sucesso.')
          PY

      - name: Validar JavaScript e estrutura
        run: |
          for f in 'CONTROLE DE CONSUMO/'*.js service-worker.js; do
            node --check "$f"
          done
          python scripts/auditar_site.py

      - name: Remover workflow temporario
        run: rm -f '.github/workflows/revisao-geral-45.yml'

      - name: Publicar revisao 4.5
        run: |
          git config user.name "X-Burguer Revisao"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Revisao geral: integrar descontos, backup e consistencia 4.5.0"
          git push origin main
