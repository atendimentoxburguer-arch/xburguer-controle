name: Atualizar icone do aplicativo

on:
  push:
    paths:
      - '.github/workflows/atualizar-icone-app.yml'

permissions:
  contents: write

jobs:
  atualizar-icone:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: pip install pillow

      - name: Gerar icones arredondados e atualizar PWA
        shell: bash
        run: |
          python <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          import json, re

          raiz = Path('.')
          logo_src = Image.open(raiz / 'CONTROLE DE CONSUMO' / 'logo.jfif').convert('RGB')
          logo_src = logo_src.crop((15, 15, 432, 432))
          pasta = raiz / 'icons'
          pasta.mkdir(exist_ok=True)

          VERSAO = '4.4.0'
          COR = '#8b0a0a'
          COR_BORDA = '#6f0707'
          DOURADO = '#d79b1f'

          def aplicar_logo(canvas, size, diametro):
              x0 = (size - diametro) // 2
              y0 = (size - diametro) // 2
              draw = ImageDraw.Draw(canvas)
              borda = max(2, size // 90)
              draw.ellipse((x0, y0, x0 + diametro, y0 + diametro), fill='#ffffff', outline=DOURADO, width=borda)
              interno = int(diametro * 0.91)
              logo = logo_src.resize((interno, interno), Image.Resampling.LANCZOS).convert('RGBA')
              mascara = Image.new('L', (interno, interno), 0)
              ImageDraw.Draw(mascara).ellipse((0, 0, interno - 1, interno - 1), fill=255)
              logo.putalpha(mascara)
              canvas.alpha_composite(logo, ((size - interno) // 2, (size - interno) // 2))

          def icone_arredondado(size):
              # Transparencia real nos cantos: no Windows o icone deixa de parecer um quadrado chapado.
              canvas = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              margem = max(2, int(size * 0.025))
              raio = int(size * 0.22)
              draw = ImageDraw.Draw(canvas)
              draw.rounded_rectangle(
                  (margem, margem, size - margem - 1, size - margem - 1),
                  radius=raio,
                  fill=COR,
                  outline=COR_BORDA,
                  width=max(1, size // 128)
              )
              aplicar_logo(canvas, size, int(size * 0.69))
              return canvas

          def icone_maskable(size):
              # Maskable deve preencher toda a area; Android/iOS aplicam a mascara do aparelho.
              canvas = Image.new('RGBA', (size, size), COR)
              aplicar_logo(canvas, size, int(size * 0.60))
              return canvas

          icone_arredondado(180).save(pasta / 'xburguer-rounded-180.png', optimize=True)
          icone_arredondado(192).save(pasta / 'xburguer-rounded-192.png', optimize=True)
          icone_arredondado(512).save(pasta / 'xburguer-rounded-512.png', optimize=True)
          icone_maskable(512).save(pasta / 'xburguer-rounded-maskable-512.png', optimize=True)

          manifest_path = raiz / 'manifest.webmanifest'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['icons'] = [
              {'src': './icons/xburguer-rounded-180.png', 'sizes': '180x180', 'type': 'image/png', 'purpose': 'any'},
              {'src': './icons/xburguer-rounded-192.png', 'sizes': '192x192', 'type': 'image/png', 'purpose': 'any'},
              {'src': './icons/xburguer-rounded-512.png', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'any'},
              {'src': './icons/xburguer-rounded-maskable-512.png', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'maskable'},
          ]
          for atalho in manifest.get('shortcuts', []):
              atalho['icons'] = [{'src': './icons/xburguer-rounded-192.png', 'sizes': '192x192', 'type': 'image/png'}]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def atualizar_html(path, prefixo):
              texto = path.read_text(encoding='utf-8')
              texto = re.sub(r'\?v=4\.[0-9]+\.[0-9]+', f'?v={VERSAO}', texto)
              texto = re.sub(r'Versão\s+4\.[0-9]+\.[0-9]+', f'Versão {VERSAO}', texto)
              apple = f'{prefixo}icons/xburguer-rounded-180.png'
              favicon = f'{prefixo}icons/xburguer-rounded-192.png'
              tag_apple = f'<link rel="apple-touch-icon" sizes="180x180" href="{apple}">'
              tag_icon = f'<link rel="icon" type="image/png" sizes="192x192" href="{favicon}">'
              if re.search(r'<link[^>]+rel="apple-touch-icon"[^>]*>', texto):
                  texto = re.sub(r'<link[^>]+rel="apple-touch-icon"[^>]*>', tag_apple, texto)
              else:
                  texto = texto.replace('</head>', f'    {tag_apple}\n</head>')
              if re.search(r'<link[^>]+rel="icon"[^>]*>', texto):
                  texto = re.sub(r'<link[^>]+rel="icon"[^>]*>', tag_icon, texto)
              else:
                  texto = texto.replace('</head>', f'    {tag_icon}\n</head>')
              path.write_text(texto, encoding='utf-8')

          atualizar_html(raiz / 'index.html', '')
          for html in (raiz / 'CONTROLE DE CONSUMO').glob('*.html'):
              atualizar_html(html, '../')

          app_path = raiz / 'CONTROLE DE CONSUMO' / 'app.js'
          app = app_path.read_text(encoding='utf-8')
          app = re.sub(r'window\.XBURGUER_VERSAO\s*=\s*"[^"]+";', f'window.XBURGUER_VERSAO = "{VERSAO}";', app)
          app = re.sub(r'X-BURGUER PWA 4\.[0-9]+', 'X-BURGUER PWA 4.4', app)
          app_path.write_text(app, encoding='utf-8')

          sw_path = raiz / 'service-worker.js'
          sw = sw_path.read_text(encoding='utf-8')
          sw = re.sub(r'xburguer-pwa-v[0-9.]+', f'xburguer-pwa-v{VERSAO}', sw)
          for antigo in [
              'xburguer-180.png','xburguer-192.png','xburguer-512.png','xburguer-maskable-512.png',
              'xburguer-app-180.png','xburguer-app-192.png','xburguer-app-512.png','xburguer-app-maskable-512.png'
          ]:
              sw = sw.replace(f'./icons/{antigo}', './icons/xburguer-rounded-180.png' if '180' in antigo else './icons/xburguer-rounded-192.png' if '192' in antigo else './icons/xburguer-rounded-maskable-512.png' if 'maskable' in antigo else './icons/xburguer-rounded-512.png')
          for novo in [
              './icons/xburguer-rounded-180.png',
              './icons/xburguer-rounded-192.png',
              './icons/xburguer-rounded-512.png',
              './icons/xburguer-rounded-maskable-512.png'
          ]:
              if f'"{novo}"' not in sw:
                  sw = sw.replace('"./manifest.webmanifest",', f'"./manifest.webmanifest",\n  "{novo}",')
          sw_path.write_text(sw, encoding='utf-8')
          PY

      - name: Publicar icones novos
        run: |
          git config user.name "X-Burguer App"
          git config user.email "actions@users.noreply.github.com"
          git add icons manifest.webmanifest index.html service-worker.js 'CONTROLE DE CONSUMO/app.js' 'CONTROLE DE CONSUMO/'*.html
          git commit -m "Arredondar icone do aplicativo e atualizar para 4.4.0" || exit 0
          git push origin main
