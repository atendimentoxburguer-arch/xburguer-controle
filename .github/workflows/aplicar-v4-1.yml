name: Aplicar versão 4.1

on:
  push:
    paths:
      - '.github/workflows/aplicar-v4-1.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar versão 4.1
        shell: bash
        run: |
          echo '' | base64 -d | gunzip > /tmp/v41.patch
          git apply --check /tmp/v41.patch
          git apply --whitespace=nowarn /tmp/v41.patch

          node --check 'CONTROLE DE CONSUMO/app.js'
          node --check 'CONTROLE DE CONSUMO/funcionarios-supabase.js'
          node --check service-worker.js
          grep -q 'window.XBURGUER_VERSAO = "4.1.0"' 'CONTROLE DE CONSUMO/app.js'
          grep -q 'xburguer-pwa-v4.1.0' service-worker.js

          rm -f .github/workflows/aplicar-v4-1.yml

      - name: Publicar atualização
        shell: bash
        run: |
          git config user.name 'ChatGPT X-Burguer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Atualizar sistema para versão 4.1'
          git push origin HEAD:main
