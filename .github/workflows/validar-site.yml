name: Validar site

on:
  push:
    branches: [main]
    paths:
      - 'CONTROLE DE CONSUMO/**'
      - 'icons/**'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'index.html'
      - 'offline.html'
      - '404.html'
      - 'scripts/auditar_site.py'
      - '.github/workflows/validar-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Auditar estrutura, HTML, CSS, JS e PWA
        id: auditoria
        shell: bash
        run: |
          set +e
          python scripts/auditar_site.py 2>&1 | tee auditoria-site.txt
          codigo=${PIPESTATUS[0]}
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Salvar relatorio da auditoria
        shell: bash
        run: |
          git config user.name "X-Burguer Auditoria"
          git config user.email "actions@users.noreply.github.com"
          git add auditoria-site.txt
          git commit -m "Atualizar relatorio de auditoria do site" || true
          git push origin main || true

      - name: Encerrar com resultado da auditoria
        shell: bash
        run: exit "${{ steps.auditoria.outputs.codigo }}"
