name: Validar site

on:
  push:
    branches: [main]
    paths:
      - 'CONTROLE DE CONSUMO/**'
      - 'icons/**'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'index.html'
      - 'offline.html'
      - '404.html'
      - 'scripts/auditar_site.py'
      - 'scripts/testes-clientes/**'
      - 'scripts/clientes*.test.cjs'
      - 'SUPABASE/migrations/**'
      - '.github/workflows/validar-site.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clientes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Preparar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Auditar estrutura, HTML, CSS, JS e PWA
        shell: bash
        run: |
          set -o pipefail
          python scripts/auditar_site.py 2>&1 | tee auditoria-site.txt

      - name: Testar cálculos e extratos de clientes
        run: node --test scripts/clientes-model.test.cjs scripts/clientes-backup.test.cjs

      - name: Testar migration e regras de clientes em banco descartável
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: clientes_test
        run: >-
          psql -v ON_ERROR_STOP=1
          -f scripts/testes-clientes/preparar.sql
          -f scripts/testes-clientes/funcoes-producao.sql
          -f SUPABASE/migrations/20261017_clientes_notinhas.sql
          -f SUPABASE/migrations/20261017_clientes_melhorias.sql
          -f SUPABASE/migrations/20261017235408_editar_excluir_notinhas.sql
          -f scripts/testes-clientes/verificar.sql
          -f scripts/testes-clientes/melhorias.sql
          -f scripts/testes-clientes/editar-excluir.sql

      - name: Testar pagamentos e edições simultâneos
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: clientes_test
        run: python scripts/testes-clientes/concorrencia.py

      - name: Guardar relatorio da auditoria
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: auditoria-site
          path: auditoria-site.txt
          retention-days: 7
