name: Validar site

on:
  push:
    branches: [main]
    paths:
      - 'CONTROLE DE CONSUMO/**'
      - 'icons/**'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'index.html'
      - 'offline.html'
      - '404.html'
      - 'scripts/auditar_site.py'
      - '.github/workflows/validar-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Preparar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Auditar estrutura, HTML, CSS, JS e PWA
        shell: bash
        run: |
          set -o pipefail
          python scripts/auditar_site.py 2>&1 | tee auditoria-site.txt

      - name: Guardar relatorio da auditoria
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: auditoria-site
          path: auditoria-site.txt
          retention-days: 7
