<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>X-Burguer Consumo</title>
<link rel="manifest" href="manifest.webmanifest?v=pwa-consumo-4">
<meta name="theme-color" content="#7a0b0b">
<meta name="application-name" content="X-Burguer Consumo">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="X-Burguer Consumo">
<link rel="apple-touch-icon" sizes="180x180" href="icons/xburguer-rounded-180.png?v=pwa-consumo-4">
<link rel="icon" type="image/png" sizes="192x192" href="icons/xburguer-rounded-192.png?v=pwa-consumo-4">
</head>
<body>
<p>Abrindo X-Burguer Consumo...</p>
<script>
(async function(){
  try{
    if('serviceWorker' in navigator){
      const expectedScope=new URL('/xburguer-controle/',location.origin).href;
      const expectedScriptPath='/xburguer-controle/service-worker.js';
      const registrations=await navigator.serviceWorker.getRegistrations();

      for(const old of registrations){
        if(old.scope!==expectedScope)continue;
        const scriptUrl=
          old.active?.scriptURL ||
          old.waiting?.scriptURL ||
          old.installing?.scriptURL ||
          '';

        if(scriptUrl && new URL(scriptUrl).pathname!==expectedScriptPath){
          await old.unregister();
        }
      }

      const reg=await navigator.serviceWorker.register(
        '/xburguer-controle/service-worker.js?v=4.5.1',
        {scope:'/xburguer-controle/',updateViaCache:'none'}
      );
      await reg.update().catch(()=>{});
      await navigator.serviceWorker.ready.catch(()=>{});
    }
  }catch(e){console.warn('PWA Consumo:',e)}

  location.replace('/xburguer-controle/CONTROLE%20DE%20CONSUMO/login.html?app=consumo');
})();
</script>
</body>
</html>
