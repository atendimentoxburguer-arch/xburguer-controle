<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>X-Burguer Consumo</title>
<link rel="manifest" href="manifest.webmanifest?v=pwa-consumo-3">
<meta name="theme-color" content="#7a0b0b">
<meta name="application-name" content="X-Burguer Consumo">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="X-Burguer Consumo">
<link rel="apple-touch-icon" sizes="180x180" href="icons/xburguer-rounded-180.png?v=pwa-consumo-3">
<link rel="icon" type="image/png" sizes="192x192" href="icons/xburguer-rounded-192.png?v=pwa-consumo-3">
</head>
<body>
<p>Abrindo X-Burguer Consumo...</p>
<script>
(async function(){
  try{
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.register('/xburguer-controle/sw-consumo.js?v=1',{scope:'/xburguer-controle/',updateViaCache:'none'});
      reg.update().catch(()=>{});
      await navigator.serviceWorker.ready.catch(()=>{});
    }
  }catch(e){console.warn('PWA Consumo:',e)}
  location.replace('/xburguer-controle/CONTROLE%20DE%20CONSUMO/login.html?app=consumo');
})();
</script>
</body>
</html>
