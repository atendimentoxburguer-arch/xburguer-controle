<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>X-Burguer Consumo | Login</title>
    <link rel="stylesheet" href="style.css?v=4.5.1">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js?v=4.5.1"></script>
    <script src="app.js?v=4.5.1"></script>
    <link rel="manifest" href="../manifest.webmanifest?v=pwa-consumo-2">
    <meta name="theme-color" content="#7a0b0b">
    <meta name="application-name" content="X-Burguer Consumo">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="X-Burguer Consumo">
    <link rel="apple-touch-icon" sizes="180x180" href="../icons/xburguer-rounded-180.png?v=pwa-consumo-2">
    <link rel="icon" type="image/png" sizes="192x192" href="../icons/xburguer-rounded-192.png?v=pwa-consumo-2">
</head>
<body>

    <div class="pagina-login">
        
        <!-- Lado Esquerdo (Fundo Vermelho) -->
        <div class="lado-esquerdo">
            <div class="conteudo-esquerda">
                <img src="logo.jfif" alt="Logo X-Burguer" class="imagem-logo">
                <p class="texto-sistema">Sistema de Controle Interno</p>
            </div>
        </div>

        <!-- Lado Direito (Painel Branco com o Formulário) -->
        <div class="lado-direito">
            <div class="caixa-login">
                <h2>Bem-vindo!</h2>
                <p class="subtitulo">Faça login para continuar</p>

                <form id="form-login" onsubmit="validarLogin(event)">
                    <div class="grupo-input">
                        <label for="usuario">E-mail</label>
                        <div class="campo-com-icone">
                            <span class="icone-input">👤</span>
                            <input type="email" id="usuario" autocomplete="username" placeholder="Digite seu e-mail" required>
                        </div>
                    </div>

                    <div class="grupo-input">
                        <label for="senha">Senha</label>
                        <div class="campo-com-icone">
                            <span class="icone-input">🔒</span>
                            <input type="password" id="senha" autocomplete="current-password" placeholder="Digite sua senha" required>
                            <button type="button" class="icone-ver-senha" id="icone-olho" onclick="mostrarSenha()" aria-label="Mostrar ou ocultar senha">👁️</button>
                        </div>
                    </div>

                    <div class="opcoes-login">
                        <span style="font-size:12px;color:#777;">Acesso restrito a usuários autorizados.</span>
                    </div>

                    <button type="submit" class="btn-entrar">ENTRAR</button>
                </form>

                <p id="status-supabase" class="status-login-conexao" style="display:none;"></p>
                <p class="rodape-login">© 2026 X-Burguer - Versão 4.5.1</p>
            </div>
        </div>
    </div>

    <script>
        function mostrarSenha() {
            var inputSenha = document.getElementById("senha");
            var iconeOlho = document.getElementById("icone-olho");

            if (inputSenha.type === "password") {
                inputSenha.type = "text";
                iconeOlho.innerText = "🙈";
            } else {
                inputSenha.type = "password";
                iconeOlho.innerText = "👁️";
            }
        }

        async function validarLogin(event) {
            event.preventDefault();

            const usuarioDigitado = document.getElementById("usuario").value.trim();
            const senhaDigitada = document.getElementById("senha").value;
            const botao = document.querySelector(".btn-entrar");

            if (!usuarioDigitado || !senhaDigitada) return;

            botao.disabled = true;
            const textoOriginal = botao.innerText;
            botao.innerText = "ENTRANDO...";

            try {
                if (!window.supabaseClient || !window.supabaseClient.auth) {
                    throw new Error("O cliente do Supabase não foi carregado. Verifique a conexão com a internet e o arquivo supabase-config.js.");
                }

                const { data, error } = await window.supabaseClient.auth.signInWithPassword({
                    email: usuarioDigitado,
                    password: senhaDigitada
                });

                if (error) {
                    console.error("Supabase signInWithPassword:", error);
                    const codigo = error.code ? `\nCódigo: ${error.code}` : "";
                    const status = error.status ? `\nStatus: ${error.status}` : "";
                    alert(`Não foi possível entrar.\n\nMotivo informado pelo Supabase:\n${error.message || "Erro sem mensagem"}${codigo}${status}`);
                    botao.disabled = false;
                    botao.innerText = textoOriginal;
                    return;
                }

                if (!data || !data.session) {
                    alert("O Supabase não retornou uma sessão de login. Verifique a configuração de autenticação.");
                    botao.disabled = false;
                    botao.innerText = textoOriginal;
                    return;
                }

                document.querySelector(".pagina-login").classList.add("saindo-login");
                setTimeout(function () {
                    window.location.href = "dashboard.html";
                }, 350);
            } catch (erro) {
                console.error("Erro inesperado no login:", erro);
                alert(`Erro ao conectar ao Supabase.\n\n${erro?.message || erro}`);
                botao.disabled = false;
                botao.innerText = textoOriginal;
            }
        }

        window.addEventListener("DOMContentLoaded", async function () {
            const status = document.getElementById("status-supabase");
            if (!status) return;

            try {
                if (!window.supabaseClient) {
                    status.textContent = "Não foi possível conectar ao sistema. Verifique sua internet.";
                    status.style.color = "#b00020";
                    status.style.display = "block";
                    return;
                }

                const resposta = await fetch(`${SUPABASE_URL}/auth/v1/health`, {
                    method: "GET",
                    headers: {
                        "apikey": SUPABASE_PUBLISHABLE_KEY
                    }
                });

                if (!resposta.ok) {
                    status.textContent = "Não foi possível conectar ao sistema. Tente novamente.";
                    status.style.color = "#b00020";
                    status.style.display = "block";
                    console.error("Teste de conexão Supabase:", resposta.status, await resposta.text());
                } else {
                    status.textContent = "";
                    status.style.display = "none";
                }
            } catch (erro) {
                status.textContent = "Sem conexão com o sistema. Verifique sua internet.";
                status.style.color = "#b00020";
                status.style.display = "block";
                console.error("Teste de conexão Supabase:", erro);
            }
        });
    </script>
</body>
</html>
